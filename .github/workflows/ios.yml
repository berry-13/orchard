name: iPad app

# Builds the iOS app (the iPad client of an Orchard server) as an unsigned IPA.
# Sign it on the device, for example with Feather, or with your Apple ID.

on:
  push:
    branches: [main, init]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read only by default; only the publish job, which runs no third-party
# actions, can write. Actions are pinned to commits (tag in the comment).
permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    env:
      # The CLI runs from crates/orchard-app; build hooks belong to the web app.
      TAURI_FRONTEND_PATH: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install tools
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: npm ci --prefix app --registry=https://registry.npmjs.org/

      # Run from crates/orchard-app so the Xcode project's "Build Rust Code"
      # phase finds crates/orchard-app/package.json when it calls npm.
      - name: Generate the Xcode project
        working-directory: crates/orchard-app
        run: npm run tauri -- ios init --ci

      # Tauri's Xcode build phase talks to the running `tauri ios build`, so
      # the build has to go through it; --no-sign leaves signing to the device.
      - name: Build (Release, unsigned)
        working-directory: crates/orchard-app
        run: npm run tauri -- ios build --no-sign --ci --target aarch64

      - name: Collect the IPA
        run: |
          ipa=$(find crates/orchard-app/gen/apple/build -name '*.ipa' -type f | head -1)
          test -n "$ipa"
          cp "$ipa" Orchard.ipa
          ls -la Orchard.ipa

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Orchard-ipa
          path: Orchard.ipa

  # A stable download link for Feather: the latest build of each branch.
  publish:
    needs: ipa
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Orchard-ipa

      # A Feather (AltStore format) source next to the IPA. Feather offers an
      # update whenever the version differs, so each build gets its own.
      - name: Write the Feather source
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa-${GITHUB_REF_NAME}"
          jq -n \
            --arg branch "$GITHUB_REF_NAME" \
            --arg version "0.1.0-${GITHUB_RUN_NUMBER}" \
            --arg build "$GITHUB_RUN_NUMBER" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "${base}/Orchard.ipa" \
            --arg icon "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/crates/orchard-app/icons/128x128@2x.png" \
            --arg notes "$(printf '%s' "$COMMIT_MESSAGE" | head -1) (${GITHUB_SHA::7})" \
            --argjson size "$(stat -c %s Orchard.ipa)" \
            '{
              name: "Orchard (\($branch))",
              identifier: "dev.berry13.orchard.source.\($branch)",
              apps: [{
                name: "Orchard",
                bundleIdentifier: "dev.berry13.orchard",
                developerName: "berry13",
                iconURL: $icon,
                localizedDescription: "The iPad client of an Orchard server.",
                version: $version,
                versionDate: $date,
                downloadURL: $url,
                size: $size,
                versions: [{
                  version: $version,
                  buildVersion: $build,
                  date: $date,
                  localizedDescription: $notes,
                  downloadURL: $url,
                  size: $size
                }]
              }]
            }' > source.json
          cat source.json

      - name: Publish to the branch's prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ipa-${GITHUB_REF_NAME}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" Orchard.ipa source.json --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "iPad app (${GITHUB_REF_NAME}, latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA}. Sign it on the device, for example with Feather."
